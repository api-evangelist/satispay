standards:
- id: cavage-http-signatures
  name: Signing HTTP Messages (Cavage/Sporny draft-10)
  conforms: true
  evidence:
    docs: https://developers.satispay.com/reference/introduction
    statement: >-
      "Our authentication relies on the principles outlined in the Signing HTTP Messages draft, which is
      part of the Web Payments initiative." The docs cite
      https://tools.ietf.org/html/draft-cavage-http-signatures-10 by URL and walk the digest, signing
      string, signature and Authorization header construction step by step.
    headers:
    - Authorization
    - Digest
    - Date
    - Host
    spec_location: >-
      Declared as parameters on every operation in openapi/satispay-gbusiness-api.json and
      openapi/satispay-production.json.
  note: >-
    This is a superseded draft. It was never published as an RFC and has been replaced by RFC 9421
    (HTTP Message Signatures). Satispay conforms to the draft it names, but an integrator using an
    RFC 9421 library will not interoperate without configuration.
- id: rfc9421
  name: HTTP Message Signatures
  conforms: false
  evidence:
    reason: >-
      The docs cite the Cavage draft-10 predecessor, not RFC 9421. No Signature-Input header, no
      structured-fields signature parameters.
- id: idempotency
  name: Idempotent request retries via an Idempotency-Key header
  conforms: true
  evidence:
    docs: https://developers.satispay.com/reference/idempotency
    header: Idempotency-Key
    scope: POST
    statement: >-
      "We'll always send back the same response for requests made with the same key." Satispay recommends
      random strings or UUIDs.
  gaps:
  - No retention window is published.
  - Behaviour on key reuse with a different request body is not documented.
