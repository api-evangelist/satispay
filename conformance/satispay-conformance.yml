domain_standards:
  regime: payments
  regime_standards_probed:
  - pci-dss
  - 3-d-secure
  - iso-20022
  - confirmation-of-payee
  - emv
  - psd2-sca
  - open-payments
  declared_in_contract: false
  detail: >-
    None of the payments-domain standards is declared anywhere in the contract. There is no ISO 20022
    message type, no EMV or 3-D Secure artefact, no Open Payments resource shape, and no SCA-specific
    parameter, exemption field or challenge response object in any of the 27 published operations. This
    is coherent with the product rather than a defect: Satispay does not run on card rails, so EMV,
    3-D Secure and card decline codes have no place in it, and consumer authentication happens inside
    the Satispay app rather than through an API-visible SCA challenge the merchant orchestrates. The
    closest thing in the contract is the HOTP_AUTH payment flow and its error code 246
    ("The HOTP token is not valid"), which is a one-time-password authorisation mechanism but is
    Satispay-specific and cites no standard.
  award: none
  note: >-
    Recorded as not-declared rather than non-conformant. Domain-standard conformance is reward-only, and
    nothing here is invented to fill the slot.
