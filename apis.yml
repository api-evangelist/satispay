apis:
- aid: satispay-gbusiness-api
  name: Satispay GBusiness API
  description: >-
    The Satispay GBusiness API is the merchant-facing payments API. It creates and updates payments across the
    MATCH_CODE, MATCH_USER, REFUND, PRE_AUTHORIZED, FUND_LOCK, PRE_AUTHORIZED_FUND_LOCK and HOTP_AUTH flows,
    lists shop payments, exchanges an activation code for a KeyId, and creates transaction reports. Amounts are
    integer cents, EUR only, and every request is signed with an RSA key pair.
  humanURL: https://developers.satispay.com/reference/introduction
  baseURL: https://authservices.satispay.com/g_business/v1
  tags:
  - Payments
  - Refunds
  - Reports
  properties:
  - type: OpenAPI
    url: openapi/satispay-gbusiness-api.json
  - type: Documentation
    url: https://developers.satispay.com/docs/welcome
  - type: APIReference
    url: https://developers.satispay.com/reference/introduction
- aid: satispay-gbusiness-production
  name: Satispay GBusiness API (production surface)
  description: >-
    The production-environment definition Satispay publishes alongside the payments API, covering consumer
    lookup, daily closure retrieval, shop profile, pre-authorized payment tokens, MQTT certificates for
    in-store devices, checkout sessions and their events, software version lookup, and the reports surface.
  humanURL: https://developers.satispay.com/reference/endpoints
  baseURL: https://authservices.satispay.com
  tags:
  - Payments
  - Sessions
  - Reports
  properties:
  - type: OpenAPI
    url: openapi/satispay-production.json
  - type: APIReference
    url: https://developers.satispay.com/reference/endpoints
- aid: satispay-gbusiness-sandbox
  name: Satispay GBusiness API (sandbox)
  description: >-
    The staging/sandbox definition Satispay publishes for verifying an RSA-signed request before going live.
    It exposes the authentication test endpoint used to confirm the Digest, Message, Signature and
    Authorization header have been composed correctly.
  humanURL: https://developers.satispay.com/reference/testinput
  baseURL: https://staging.authservices.satispay.com
  tags:
  - Sandbox
  - Authentication
  properties:
  - type: OpenAPI
    url: openapi/satispay-sandbox.json
  - type: APIReference
    url: https://developers.satispay.com/reference/testinput
