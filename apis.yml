aid: satispay
name: Satispay
description: >-
  Satispay is an Italian mobile payment network and e-money institution, founded in 2013 and headquartered
  in Milan, that lets consumers pay merchants directly from a bank account without card rails. For developers
  it publishes the Satispay GBusiness API — an HTTPS/JSON payments API served from authservices.satispay.com
  with a staging twin at staging.authservices.satispay.com — covering one-off payments (QR match-code, phone
  match-user, HOTP), automatic/pre-authorized recurring payments, funds lock, refunds, consumer lookup,
  shop profile, MQTT certificates for in-store devices, checkout sessions, daily closures and transaction
  reports. Authentication is RSA request signing following the "Signing HTTP Messages" (Cavage) draft rather
  than OAuth, POSTs accept an Idempotency-Key header, and payment status changes are delivered to a merchant
  callback_url. Satispay also ships first-party e-commerce plugins (Shopify, Shopware, WooCommerce,
  PrestaShop, Magento 2), a PHP SDK, and in-store Java and Swift SDKs.
