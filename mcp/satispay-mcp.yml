note: >-
  Satispay serves a live remote MCP endpoint on its own developer-portal host. A GET returns
  "This URL can only be accessed with a MCP client." (HTTP 200) and a JSON-RPC POST returns
  {"jsonrpc":"2.0","error":{"code":-32001,"message":"Authorization required"}} (HTTP 401) for both
  tools/list and initialize, so the live tool schemas are auth-gated and were not captured. This is a
  documentation MCP server surfacing the developer portal, not the payments API — it is served from
  developers.satispay.com, not from the authservices.satispay.com API host. Satispay serves no OAuth
  discovery metadata for it: /.well-known/oauth-protected-resource,
  /.well-known/oauth-protected-resource/mcp and /.well-known/oauth-authorization-server all 404 on that
  host, so an MCP client that follows RFC 9728 to find the authorization server has nowhere to go.
