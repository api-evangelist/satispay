note: >-
  Satispay has both an MCP endpoint and published OpenAPI, so a crosswalk is owed. It cannot be populated
  on the MCP side: the live tools/list is auth-gated (HTTP 401, Authorization required) and Satispay
  publishes no tool list anywhere else — its llms.txt is a documentation index, not a tool manifest. No
  tool names are guessed. The crosswalk is therefore honest about the shape of the divergence: every
  published REST operation is currently rest_only with respect to any agent that cannot authenticate to
  the MCP server, and the MCP server that does exist serves documentation, not payments.
